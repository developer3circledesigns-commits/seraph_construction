<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interiors — B. Masonry Grid | SERAPH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#001431;--bg2:#0A2540;--gold:#E7C959;--white:#fff;--gray:#CFCFCF;--muted:#9D9D9D;
    --font:'Poppins',sans-serif;--display:'Montserrat',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--gray);font-family:var(--font);line-height:1.7;overflow-x:hidden}
  h1,h2,h3{font-family:var(--display);color:var(--white);line-height:1.15}
  img{max-width:100%;display:block}
  a{text-decoration:none}
  .container{width:min(1200px,92%);margin:0 auto}
  .topbar{position:fixed;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 28px;z-index:1000;background:rgba(0,20,49,.65);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
  .topbar .brand{font-family:var(--display);color:var(--white);font-weight:700;letter-spacing:3px}
  .topbar .brand em{color:var(--gold);font-style:normal}
  .topbar a{font-family:var(--display);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .topbar a:hover{color:var(--gold)}
  .eyebrow{display:block;color:var(--gold);font-family:var(--display);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}

  .gallery{padding:150px 0 100px}
  .gallery-head{max-width:640px;margin-bottom:64px}
  .gallery-head h1{font-size:clamp(36px,6vw,64px);letter-spacing:-.02em;margin-bottom:20px}
  .gallery-head p{color:var(--muted);font-size:16px}

  .masonry{columns:3;column-gap:20px}
  .tile{break-inside:avoid;margin-bottom:20px;position:relative;overflow:hidden;border-radius:10px}
  .tile img{width:100%;transition:transform .8s cubic-bezier(.2,.6,.2,1)}
  .tile:hover img{transform:scale(1.06)}
  .tile__meta{position:absolute;left:0;right:0;bottom:0;padding:64px 20px 18px;background:linear-gradient(to top,rgba(0,20,49,.85),transparent);color:#fff;opacity:0;transform:translateY(8px);transition:.5s}
  .tile:hover .tile__meta{opacity:1;transform:none}
  .tile__meta .num{font-family:var(--display);font-size:11px;letter-spacing:2px;color:var(--gold)}
  .tile__meta h3{font-size:18px}

  @media (max-width:900px){.masonry{columns:2}}
  @media (max-width:560px){.masonry{columns:1}}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">SERAPH <em>B</em></span>
  <a href="index.html">All Layouts</a>
</header>

<section class="gallery">
  <div class="container">
    <div class="gallery-head">
      <span class="eyebrow">Interiors &middot; Masonry Gallery</span>
      <h1>Our Interior Portfolio</h1>
      <p>A flowing gallery of completed rooms — hover or tap any tile to see the story behind each space.</p>
    </div>

    <div class="masonry" id="masonry">
      <figure class="tile"><img src="../images/interior-living-room.webp" alt="Living room" width="800" height="534"><figcaption class="tile__meta"><span class="num">Living &middot; 01</span><h3>Scala Living Room</h3></figcaption></figure>
      <figure class="tile"><img src="https://images.unsplash.com/photo-1519710164239-da123dc03ef4?auto=format&fit=crop&w=700&q=80" alt="Dining room" width="700" height="930"><figcaption class="tile__meta"><span class="num">Dining &middot; 02</span><h3>Marble Dining Suite</h3></figcaption></figure>
      <figure class="tile"><img src="../images/modular_kitchen/kitchen-view-3-island.webp" alt="Kitchen island" width="700" height="470"><figcaption class="tile__meta"><span class="num">Kitchen &middot; 03</span><h3>Island Kitchen</h3></figcaption></figure>
      <figure class="tile"><img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=700&q=80" alt="Bedroom" width="800" height="1200"><figcaption class="tile__meta"><span class="num">Bedroom &middot; 04</span><h3>Retreat Master Suite</h3></figcaption></figure>
      <figure class="tile"><img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=700&q=80" alt="Study room" width="800" height="533"><figcaption class="tile__meta"><span class="num">Study &middot; 05</span><h3>Warm Study &amp; Library</h3></figcaption></figure>
      <figure class="tile"><img src="https://images.unsplash.com/photo-1552321554-5fefe8c9ef14?auto=format&fit=crop&w=700&q=80" alt="Bathroom" width="800" height="1200"><figcaption class="tile__meta"><span class="num">Bath &middot; 06</span><h3>Stone SpaLounge</h3></figcaption></figure>
      <figure class="tile"><img src="../images/modular_kitchen/kitchen-view-2-pantry.webp" alt="Pantry kitchen" width="700" height="470"><figcaption class="tile__meta"><span class="num">Kitchen &middot; 07</span><h3>Pantry &amp; Prep</h3></figcaption></figure>
      <figure class="tile"><img src="https://images.unsplash.com/photo-1493809842364-78817add7ffb?auto=format&fit=crop&w=700&q=80" alt="Living room window" width="800" height="1200"><figcaption class="tile__meta"><span class="num">Living &middot; 08</span><h3>Light Frame Living</h3></figcaption></figure>
      <figure class="tile"><img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=700&q=80" alt="Bedroom detail" width="800" height="533"><figcaption class="tile__meta"><span class="num">Bedroom &middot; 09</span><h3>Headboard Detail</h3></figcaption></figure>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

if (!reduce) {
  gsap.to('.tile', {
    opacity: 0, y: 60, duration: 1.2, ease: 'power3.out', stagger: 0.12,
    scrollTrigger: { trigger: '#masonry', start: 'top 80%', once: true },
  });
} else {
  document.querySelectorAll('.tile').forEach(t => t.style.opacity = 1);
}
</script>
</body>
</html>
