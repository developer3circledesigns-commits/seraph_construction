<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interiors — F. Room Filter Cards | SERAPH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#001431;--bg2:#0A2540;--gold:#E7C959;--white:#fff;--gray:#CFCFCF;--muted:#9D9D9D;--font:'Poppins',sans-serif;--display:'Montserrat',sans-serif; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--gray);font-family:var(--font);line-height:1.7;overflow-x:hidden}
  h1,h2,h3{font-family:var(--display);color:var(--white);line-height:1.15}
  img{max-width:100%;display:block}
  a{text-decoration:none}
  .container{width:min(1200px,92%);margin:0 auto}
  .topbar{position:fixed;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 28px;z-index:1000;background:rgba(0,20,49,.65);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
  .topbar .brand{font-family:var(--display);color:var(--white);font-weight:700;letter-spacing:3px}
  .topbar .brand em{color:var(--gold);font-style:normal}
  .topbar a{font-family:var(--display);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .topbar a:hover{color:var(--gold)}
  .eyebrow{display:block;color:var(--gold);font-family:var(--display);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}

  .filter{padding:150px 0 100px}
  .filter-head{max-width:640px;margin-bottom:40px}
  .filter-head h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.02em;margin-bottom:16px}
  .filter-head p{color:var(--muted);font-size:16px}

  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px}
  .f-btn{font-family:var(--display);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid rgba(255,255,255,.15);padding:11px 20px;cursor:pointer;transition:.3s;border-radius:50px}
  .f-btn:hover{color:var(--white);border-color:rgba(231,201,89,.5)}
  .f-btn.active{color:var(--bg);background:var(--gold);border-color:var(--gold)}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
  .card{position:relative;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:var(--bg2)}
  .card img{width:100%;height:260px;object-fit:cover;transition:transform .8s cubic-bezier(.2,.6,.2,1)}
  .card:hover img{transform:scale(1.06)}
  .card__body{padding:22px}
  .card__body .cat{font-family:var(--display);font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
  .card__body h3{font-size:20px;margin-bottom:6px}
  .card__body p{font-size:13px;color:var(--muted)}
  .card .tag-room{position:absolute;top:14px;left:14px;font-family:var(--display);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#fff;background:rgba(0,20,49,.7);padding:4px 12px;border-radius:50px;backdrop-filter:blur(6px)}

  @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">SERAPH <em>F</em></span>
  <a href="index.html">All Layouts</a>
</header>

<section class="filter">
  <div class="container">
    <div class="filter-head">
      <span class="eyebrow">Interiors &middot; Browsable</span>
      <h1>Browse by Room &amp; Style</h1>
      <p>Filter the gallery to focus on a room type. Tap any card to explore the full project.</p>
    </div>

    <div class="filter-bar" id="filterBar" aria-label="Filter interiors">
      <button class="f-btn active" data-filter="all">All</button>
      <button class="f-btn" data-filter="living">Living</button>
      <button class="f-btn" data-filter="bedroom">Bedroom</button>
      <button class="f-btn" data-filter="kitchen">Kitchen</button>
      <button class="f-btn" data-filter="bath">Bath</button>
    </div>

    <div class="card-grid" id="grid">
      <figure class="card" data-room="living">
        <img src="../images/interior-living-room.webp" alt="Living room">
        <span class="tag-room">Living</span>
        <figcaption class="card__body"><p class="cat">Contemporary</p><h3>Scala Living</h3><p>High ceilings, feature wall and ambient lighting.</p></figcaption>
      </figure>

      <figure class="card" data-room="kitchen">
        <img src="../images/modular_kitchen/kitchen-view-1-wide.webp" alt="Kitchen">
        <span class="tag-room">Kitchen</span>
        <figcaption class="card__body"><p class="cat">Modular</p><h3>Island Kitchen</h3><p>Marble counters, soft-close storage, under-cabinet light.</p></figcaption>
      </figure>

      <figure class="card" data-room="bedroom">
        <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=800&q=80" alt="Bedroom">
        <span class="tag-room">Bedroom</span>
        <figcaption class="card__body"><p class="cat">Warm Minimal</p><h3>Retreat Suite</h3><p>Custom wardrobe, acoustic panels, dimmer scenes.</p></figcaption>
      </figure>

      <figure class="card" data-room="bath">
        <img src="https://images.unsplash.com/photo-1552321554-5fefe8c9ef14?auto=format&fit=crop&w=800&q=80" alt="Bathroom">
        <span class="tag-room">Bath</span>
        <figcaption class="card__body"><p class="cat">Stone &amp; Chrome</p><h3>Spa Lounge</h3><p>Rain shower, vanity stone, heated mirror.</p></figcaption>
      </figure>

      <figure class="card" data-room="living">
        <img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=800&q=80" alt="Study lounge">
        <span class="tag-room">Living</span>
        <figcaption class="card__body"><p class="cat">Editorial</p><h3>Quiet Study</h3><p>Warm wood shelving and a corner built to focus.</p></figcaption>
      </figure>

      <figure class="card" data-room="kitchen">
        <img src="../images/modular_kitchen/kitchen-view-2-pantry.webp" alt="Pantry">
        <span class="tag-room">Kitchen</span>
        <figcaption class="card__body"><p class="cat">Storage-first</p><h3>Pantry &amp; Prep</h3><p>Floor-to-ceiling storage, neatly in its place.</p></figcaption>
      </figure>

      <figure class="card" data-room="bedroom">
        <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=800&q=80" alt="Bedroom detail">
        <span class="tag-room">Bedroom</span>
        <figcaption class="card__body"><p class="cat">Soft Finish</p><h3>Headboard Detail</h3><p>Textured panels and layered bedside light.</p></figcaption>
      </figure>

      <figure class="card" data-room="bath">
        <img src="https://images.unsplash.com/photo-1507652313519-d4e9174996dd?auto=format&fit=crop&w=800&q=80" alt="Bath">

        <span class="tag-room">Bath</span>
        <figcaption class="card__body"><p class="cat">Spa Retreat</p><h3>Vanity Suite</h3><p>Stone top, soft-close drawers, chrome fittings.</p></figcaption>
      </figure>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
gsap.registerPlugin();
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const bar = document.getElementById('filterBar');
const cards = document.querySelectorAll('.card');

bar.addEventListener('click', (e) => {
  const btn = e.target.closest('.f-btn');
  if (!btn) return;
  bar.querySelectorAll('.f-btn').forEach(b => b.classList.toggle('active', b === btn));
  const f = btn.dataset.filter;
  cards.forEach(card => {
    const show = f === 'all' || card.dataset.room === f;
    if (reduce) { card.style.display = show ? '' : 'none'; return; }
    if (show) {
      card.style.display = '';
      gsap.fromTo(card, { opacity: 0, y: 20, scale: .96 }, { opacity: 1, y: 0, scale: 1, duration: .4, ease: 'power2.out' });
    } else {
      gsap.to(card, { opacity: 0, scale: .96, y: 8, duration: .25, ease: 'power2.in', onComplete: () => { card.style.display = 'none'; } });
    }
  });
});
</script>
</body>
</html>
