server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    charset utf-8;

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Block PHP execution inside uploads (defense in depth)
    location ~* /uploads/.*\.php$ {
        deny all;
        return 403;
    }

    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Content-Type application/javascript always;
    }

    # Pass PHP requests to the FPM container
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Disable proxy buffering for SSE streams
        fastcgi_param X-Accel-Buffering no;
        fastcgi_buffering off;
    }

    location / {
        try_files $uri $uri/ $uri.php /index.php?$query_string;
    }

    # Root text files must never fall back to the app
    location = /robots.txt { default_type text/plain; }
    location = /llms.txt { default_type text/plain; }

    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
